#
# API Gateway do sistema (NGINX como proxy reverso).
#
# E a unica porta aberta para fora (80). Recebe todas as requisicoes e
# repassa para as duas instancias da aplicacao (app1 e app2), que ficam
# so na rede interna do Docker.
#
#   load balance: as requisicoes sao divididas entre app1 e app2
#   failover:     se uma instancia cair, tudo vai para a outra
#

# Registra no log qual instancia atendeu cada requisicao (upstream=...),
# para acompanhar a divisao com "docker compose logs -f nginx"
log_format gateway '$remote_addr "$request" $status upstream=$upstream_addr';

# DNS interno do Docker, usado pelo "resolve" do upstream para achar
# o IP atual de app1 e app2
resolver 127.0.0.11 valid=10s;

# Grupo de servidores de back-end (redundancia).
# Sem algoritmo declarado o NGINX usa round-robin: alterna entre os dois.
upstream servidores_back_estoque {
    # memoria compartilhada exigida pelo "resolve" abaixo
    zone servidores_back_estoque 64k;

    # max_fails=2 e fail_timeout=10s: se a instancia falhar 2 vezes em
    # 10 segundos, fica 10 segundos fora da lista e nao recebe trafego.
    # resolve: se o container voltar com outro IP, o NGINX descobre sozinho.
    server app1:8080 max_fails=2 fail_timeout=10s resolve;
    server app2:8080 max_fails=2 fail_timeout=10s resolve;
}

server {
    listen 80;

    access_log /var/log/nginx/access.log gateway;

    location / {
        # Encaminha as requisicoes para o grupo definido acima
        proxy_pass http://servidores_back_estoque;

        # Failover: se a instancia escolhida falhar (recusou a conexao,
        # demorou demais ou respondeu 502/503), tenta a outra.
        # Um POST que ja chegou a instancia NAO e reenviado (o NGINX so
        # repete metodos idempotentes): repetir uma saida de estoque
        # poderia lancar a mesma saida duas vezes.
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;

        # Cabecalhos para a aplicacao saber a origem real da requisicao
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Mostra no navegador (F12 > Rede) qual instancia respondeu
        add_header X-Servidor $upstream_addr always;
    }
}
