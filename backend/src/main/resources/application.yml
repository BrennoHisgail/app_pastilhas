spring:
  application:
    name: controle-estoque

  datasource:
    # Os valores depois dos dois pontos sao o padrao, usado quando
    # a variavel nao existe - que e o caso da nossa maquina.
    # Na nuvem o servidor define essas variaveis.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:estoque}
    username: ${DB_USER:estoque}
    password: ${DB_PASSWORD:estoque}

  jpa:
    # validate: quem cria as tabelas e o Flyway, o Hibernate so confere
    # se as entidades batem com o banco
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Sessao de login gravada no PostgreSQL (Spring Session JDBC), para as
  # duas instancias atras do NGINX enxergarem o mesmo login.
  # never: quem cria as tabelas e o Flyway (V6__sessoes_http.sql).
  session:
    jdbc:
      initialize-schema: never

springdoc:
  # Chaves em ordem alfabetica: o docs/openapi.yaml exportado fica estavel
  writer-with-order-by-keys: true
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

server:
  # Em producao o servico define a porta pela variavel PORT.
  # Rodando na nossa maquina nao existe essa variavel, entao usa 8080.
  port: ${PORT:8080}

  # A aplicacao roda atras do NGINX. "native" faz o Tomcat ler os
  # cabecalhos X-Forwarded-* que o NGINX envia, para os redirecionamentos
  # (login, logout) usarem o endereco que o usuario digitou.
  forward-headers-strategy: native

  servlet:
    session:
      cookie:
        # O Spring Session chamaria o cookie de "SESSION". Mantemos o nome
        # de sempre: o logout e a documentacao da API usam JSESSIONID.
        name: JSESSIONID

logging:
  level:
    # INFO no servidor para nao encher o disco de log.
    # Para investigar algo na nossa maquina: LOG_LEVEL=DEBUG
    br.com.ddametalurgica.estoque: ${LOG_LEVEL:INFO}
