  /login:
    post:
      description: "Cria a sessão (cookie JSESSIONID). Endpoint do Spring Security,\
        \ usado pela tela de login."
      operationId: login
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                _csrf:
                  type: string
                  description: Token CSRF da página de login
                password:
                  type: string
                  format: password
                  description: Senha
                username:
                  type: string
                  description: E-mail do usuário
                  example: admin@dda.com.br
              required:
              - username
              - password
              - _csrf
        required: true
      responses:
        "302":
          description: "Sucesso: redireciona para /. Falha: redireciona para /login?erro=true"
          headers:
            Location:
              schema:
                type: string
      summary: Login por formulário
      tags:
      - Autenticação
  /logout:
    post:
      description: Encerra a sessão e apaga o cookie JSESSIONID.
      operationId: logout
      responses:
        "302":
          description: Redireciona para /login?saiu=true
          headers:
            Location:
              schema:
                type: string
      security:
      - csrf: []
        sessao: []
      summary: Logout
      tags:
      - Autenticação
components:
  schemas:
    AlterarSenhaRequest:
      type: object
      description: Nova senha do usuário
      properties:
        novaSenha:
          type: string
          example: novaSenha123
          maxLength: 2147483647
          minLength: 8
      required:
      - novaSenha
    IndicadorPastilhaResponse:
      type: object
      properties:
        abaixoDoPontoDePedido:
          type: boolean
        classeAbc:
          type: string
          enum:
          - A
          - B
          - C
        coberturaDias:
          type: number
        codigo:
          type: string
        consumoMedioDiario:
          type: number
        consumoPeriodo:
          type: number
        descricao:
          type: string
        giro:
          type: number
        id:
          type: integer
          format: int64
        percentualAcumulado:
          type: number
        pontoDePedido:
          type: number
        saldoAtual:
          type: number
        unidadeMedida:
          type: string
          enum:
          - UN
          - PC
          - CX
          - KG
          - M
        valorConsumido:
          type: number
    IndicadoresEstoqueResponse:
      type: object
      properties:
        abaixoDoPontoDePedido:
          type: integer
          format: int64
        classeA:
          type: integer
          format: int64
        classeB:
          type: integer
          format: int64
        classeC:
          type: integer
          format: int64
        dias:
          type: integer
          format: int32
        itens:
          type: array
          items:
            $ref: "#/components/schemas/IndicadorPastilhaResponse"
    IndicadoresResponse:
      type: object
      properties:
        alertasReposicao:
          type: array
          items:
            $ref: "#/components/schemas/PastilhaResponse"
        categorias:
          type: integer
          format: int64
        itensAbaixoDoMinimo:
          type: integer
          format: int64
        itensCadastrados:
          type: integer
          format: int64
        movimentacoesRecentes:
          type: array
          items:
            $ref: "#/components/schemas/MovimentacaoResponse"
        movimentacoesUltimos30Dias:
          type: integer
          format: int64
        valorEmEstoque:
          type: number
    MovimentacaoRequest:
      type: object
      description: Dados de uma movimentação de estoque
      properties:
        documento:
          type: string
          description: "Nota fiscal, ordem de produção ou requisição"
          example: NF 12345
          maxLength: 60
          minLength: 0
        observacao:
          type: string
          maxLength: 400
          minLength: 0
        origemDestino:
          type: string
          description: "Fornecedor na entrada, setor ou ordem na saída"
          example: Fornecedor Sandvik
          maxLength: 160
          minLength: 0
        pastilhaId:
          type: integer
          format: int64
          example: 1
        quantidade:
          type: number
          example: 25
      required:
      - pastilhaId
      - quantidade
    MovimentacaoResponse:
      type: object
      properties:
        dataHora:
          type: string
          format: date-time
        documento:
          type: string
        id:
          type: integer
          format: int64
        observacao:
          type: string
        origemDestino:
          type: string
        pastilhaCodigo:
          type: string
        pastilhaDescricao:
          type: string
        pastilhaId:
          type: integer
          format: int64
        quantidade:
          type: number
        saldoApos:
          type: number
        tipo:
          type: string
          enum:
          - ENTRADA
          - SAIDA
          - AJUSTE
        usuarioNome:
          type: string
    NivelMinimoRequest:
      type: object
      properties:
        nivelMinimo:
          type: number
      required:
      - nivelMinimo
    PageMovimentacaoResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/MovimentacaoResponse"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PagePastilhaResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/PastilhaResponse"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageUsuarioResponse:
      type: object
      properties:
        content:
          type: array
          items:
            $ref: "#/components/schemas/UsuarioResponse"
        empty:
          type: boolean
        first:
          type: boolean
        last:
          type: boolean
        number:
          type: integer
          format: int32
        numberOfElements:
          type: integer
          format: int32
        pageable:
          $ref: "#/components/schemas/PageableObject"
        size:
          type: integer
          format: int32
        sort:
          $ref: "#/components/schemas/SortObject"
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        paged:
          type: boolean
        sort:
          $ref: "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    PastilhaRequest:
      type: object
      description: Dados de cadastro/edição de uma pastilha
      properties:
        categoria:
          type: string
          example: Torneamento
          maxLength: 80
          minLength: 0
        codigo:
          type: string
          example: CNMG120408
          maxLength: 40
          minLength: 0
        custoUnitario:
          type: number
          example: 38.9
        descricao:
          type: string
          example: Pastilha de torneamento CNMG 120408 metal duro
          maxLength: 200
          minLength: 0
        estoqueSeguranca:
          type: number
          description: Reserva técnica (Qs do Ponto de Pedido)
          example: 20
        leadTimeDias:
          type: integer
          format: int32
          description: Tempo de reposição em dias (t do Ponto de Pedido)
          example: 10
        nivelMinimo:
          type: number
          description: Saldo a partir do qual o item entra na lista de reposição
          example: 50
        unidadeMedida:
          type: string
          enum:
          - UN
          - PC
          - CX
          - KG
          - M
          example: UN
      required:
      - categoria
      - codigo
      - custoUnitario
      - descricao
      - estoqueSeguranca
      - leadTimeDias
      - nivelMinimo
      - unidadeMedida
    PastilhaResponse:
      type: object
      properties:
        abaixoDoMinimo:
          type: boolean
        ativo:
          type: boolean
        atualizadoEm:
          type: string
          format: date-time
        categoria:
          type: string
        codigo:
          type: string
        criadoEm:
          type: string
          format: date-time
        custoUnitario:
          type: number
        descricao:
          type: string
        estoqueSeguranca:
          type: number
        id:
          type: integer
          format: int64
        leadTimeDias:
          type: integer
          format: int32
        nivelMinimo:
          type: number
        saldoAtual:
          type: number
        unidadeMedida:
          type: string
          enum:
          - UN
          - PC
          - CX
          - KG
          - M
        valorEmEstoque:
          type: number
    ProblemDetail:
      type: object
      description: Erro no formato RFC 7807
      properties:
        detail:
          type: string
          example: "Saldo insuficiente: a pastilha CNMG120408 tem 10 UN em estoque,\
            \ e a saída pede 25."
        erros:
          type: object
          additionalProperties:
            type: string
          description: "Só em erros de validação: mensagem por campo"
          example:
            quantidade: A quantidade deve ser maior que zero
        instance:
          type: string
          example: /api/movimentacoes/saida
        status:
          type: integer
          format: int32
          example: 422
        title:
          type: string
          example: Operação não permitida
        type:
          type: string
          example: about:blank
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    UsuarioCreateRequest:
      type: object
      description: Dados de cadastro de um usuário
      properties:
        email:
          type: string
          format: email
          example: fulana@dda.com.br
          maxLength: 160
          minLength: 0
        nome:
          type: string
          example: Fulana da Silva
          maxLength: 120
          minLength: 0
        perfil:
          type: string
          enum:
          - ADMIN
          - OPERADOR
          example: OPERADOR
        senha:
          type: string
          example: senha123
          maxLength: 2147483647
          minLength: 8
      required:
      - email
      - nome
      - perfil
      - senha
    UsuarioResponse:
      type: object
      properties:
        ativo:
          type: boolean
        atualizadoEm:
          type: string
          format: date-time
        criadoEm:
          type: string
          format: date-time
        email:
          type: string
        id:
          type: integer
          format: int64
        nome:
          type: string
        perfil:
          type: string
          enum:
          - ADMIN
          - OPERADOR
    UsuarioUpdateRequest:
      type: object
      description: Dados de edição de um usuário
      properties:
        nome:
          type: string
          example: Fulana da Silva
          maxLength: 120
          minLength: 0
        perfil:
          type: string
          enum:
          - ADMIN
          - OPERADOR
          example: OPERADOR
      required:
      - nome
      - perfil
  securitySchemes:
    csrf:
      description: "Token CSRF, obrigatório em POST, PUT, PATCH e DELETE"
      in: header
      name: X-CSRF-TOKEN
      type: apiKey
    sessao:
      description: Cookie de sessão criado pelo POST /login
      in: cookie
      name: JSESSIONID
      type: apiKey
