        **Perfil:** ADMIN ou OPERADOR
      operationId: movimentacoes
      parameters:
      - description: Filtra por pastilha; ausente traz todas
        in: query
        name: pastilhaId
        required: false
        schema:
          type: integer
          format: int64
      - description: Data inicial (aaaa-mm-dd)
        in: query
        name: de
        required: false
        schema:
          type: string
          format: date
      - description: Data final (aaaa-mm-dd)
        in: query
        name: ate
        required: false
        schema:
          type: string
          format: date
      responses:
        "200":
          content:
            text/csv:
              schema:
                type: string
                format: binary
          description: Arquivo CSV (separador ;)
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Dados inválidos (corpo, parâmetro ou validação)"
        "401":
          description: "Sem sessão: faça login em POST /login"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Perfil sem permissão
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro inesperado no servidor
      security:
      - sessao: []
      summary: Movimentações em CSV
      tags:
      - Relatórios
  /api/usuarios:
    get:
      description: '**Perfil:** ADMIN'
      operationId: listar
      parameters:
      - description: Trecho do nome ou do e-mail
        in: query
        name: busca
        required: false
        schema:
          type: string
      - description: false lista os usuários inativados
        in: query
        name: ativo
        required: false
        schema:
          type: boolean
          default: true
      - description: Zero-based page index (0..N)
        in: query
        name: page
        required: false
        schema:
          type: integer
          default: 0
          minimum: 0
      - description: The size of the page to be returned
        in: query
        name: size
        required: false
        schema:
          type: integer
          default: 20
          minimum: 1
      - description: "Sorting criteria in the format: property,(asc|desc). Default\
          \ sort order is ascending. Multiple sort criteria are supported."
        in: query
        name: sort
        required: false
        schema:
          type: array
          default:
          - "nome,ASC"
          items:
            type: string
      responses:
        "200":
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageUsuarioResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Dados inválidos (corpo, parâmetro ou validação)"
        "401":
          description: "Sem sessão: faça login em POST /login"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Perfil sem permissão
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro inesperado no servidor
      security:
      - sessao: []
      summary: Lista os usuários com filtro e paginação
      tags:
      - Usuários
    post:
      description: '**Perfil:** ADMIN'
      operationId: criar
      requestBody:
        content:
          application/json:
            schema:
