openapi: 3.1.0
info:
  contact:
    name: Equipe Projeto Aplicado III - UniSENAI
  description: |
    MVP do sistema de controle de estoque da DDA Metalúrgica.

    Projeto Aplicado III - ADS 4ª fase - UniSENAI.
    Equipe: Brenno Meurer, Vinicius Barcellos, Pedro Ptelzi e Pedro Luis.

    ## Autenticação
    A API usa a sessão do login por formulário (`POST /login`), guardada no
    cookie `JSESSIONID`. Sem sessão válida, as rotas de `/api` respondem **401**.

    ## CSRF
    Toda requisição que altera dados (POST, PUT, PATCH, DELETE) precisa enviar o
    token CSRF no cabeçalho `X-CSRF-TOKEN`. As telas leem o token das tags
    `<meta name="_csrf">` do layout. Sem o token, a resposta é **403**.

    ## Perfis
    - **OPERADOR**: consulta pastilhas, registra entradas e saídas, vê painel,
      indicadores e relatórios.
    - **ADMIN**: tudo do operador, mais cadastro de pastilhas e gestão de usuários.

    Cada operação informa o perfil exigido na descrição.

    ## Erros
    Os erros seguem o formato ProblemDetail (RFC 7807). Erros de validação trazem
    o campo `erros`, com a mensagem de cada campo.
  title: API - Controle de Estoque de Pastilhas Industriais
  version: 0.1.0
servers:
- url: /
tags:
- description: "Painel, alertas de reposição e indicadores de estoque"
  name: Indicadores
- description: "Entradas, saídas e histórico do estoque"
  name: Movimentações
- description: Cadastro e consulta das pastilhas
  name: Pastilhas
- description: Exportação do estoque e das movimentações em CSV
  name: Relatórios
- description: Gestão de usuários do sistema
  name: Usuários
paths:
  /api/alertas/reposicao:
    get:
      description: |-
        Pastilhas que chegaram no nível mínimo, as mais críticas primeiro.

        **Perfil:** ADMIN ou OPERADOR
      operationId: alertas
      parameters:
      - description: "Quantos itens trazer, de 1 a 200"
        in: query
        name: limite
        required: false
        schema:
          type: integer
          format: int32
          default: 50
          maximum: 200
          minimum: 1
      responses:
        "200":
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PastilhaResponse"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: "Dados inválidos (corpo, parâmetro ou validação)"
        "401":
          description: "Sem sessão: faça login em POST /login"
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Perfil sem permissão
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
          description: Erro inesperado no servidor
      security:
      - sessao: []
      summary: Itens que precisam de reposição
      tags:
      - Indicadores
